<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>PHP 扩展开发手册</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐘</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* ---- 封面：没有背景图时，保证标题 / 按钮 / 文字清晰可见 ---- */
    .cover {
      background:
        radial-gradient(1100px 550px at 15% 8%, rgba(255,255,255,.12), transparent),
        linear-gradient(135deg, #155c40 0%, #2b8f5f 55%, #42b983 100%) !important;
      color: #fff !important;
    }
    .cover-main h1 {
      color: #fff !important;
      text-shadow: 0 2px 8px rgba(0,0,0,.35);
    }
    .cover-main p,
    .cover-main blockquote {
      color: rgba(255,255,255,.95) !important;
    }
    .cover-main blockquote {
      border-left: 4px solid rgba(255,255,255,.65);
    }
    /* “开始阅读 / GitHub”按钮：白色描边胶囊，悬停反色 */
    .cover-main a.cover-btn,
    .cover-main > p > a {
      display: inline-block;
      margin: .5em .35em;
      padding: .55em 1.5em;
      border: 2px solid #fff !important;
      border-radius: 24px;
      background: rgba(255,255,255,.15) !important;
      color: #fff !important;
      font-weight: 600;
      text-decoration: none;
    }
    .cover-main a.cover-btn:hover,
    .cover-main > p > a:hover {
      background: #fff !important;
      color: #155c40 !important;
    }
  </style>
</head>
<body>
  <div id="app">加载中…</div>
  <script>
    window.$docsify = {
      name: 'PHP 扩展开发手册',
      repo: 'freewu/php-extension-cookbook',
      // 结构
      loadSidebar: true,
      subMaxLevel: 4,
      maxLevel: 4,
      coverpage: true,
      auto2top: true,
      // 搜索插件
      search: {
        placeholder: '搜索',
        noData: '没有找到结果',
        depth: 6
      },
      // 字数统计
      count: {
        countable: true,
        position: "top",
        margin: "10px",
        float: "right",
        fontsize: "0.9em",
        color: "red",
        language: "chinese",
        localization: {
          words: "",
          minute: "",
        },
        isExpected: true,
      },
      // 底部导航
      pagination: {
        previousText: "上一页",
        nextText: "下一页",
        crossChapter: true,
        crossChapterText: true,
      },
      // 页面右侧toc
      toc: {
        tocMaxLevel: 3,
        target: "h2, h3, h4, h5, h6",
      },
      // 显示最近更新时间
      formatUpdated: '{YYYY}-{MM}-{DD}',
      executeScript: true,
      // 封面“开始阅读”跳转到 #/?id=… 后收起封面，露出正文
      doneEach: function () {
        if (location.hash.indexOf('?id=') !== -1) {
          var cover = document.querySelector('.cover');
          if (cover) cover.style.display = 'none';
        }
      }
    }
  </script>
  <!-- docsify 及插件（CDN 加载，离线环境请自行下载到本地） -->
  <!--<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/copy-code.min.js"></script>-->
  <!-- docsify -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- 代码高亮  https://cdn.jsdelivr.net/npm/prismjs@1/components/ -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-cmake.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-docker.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-php.min.js"></script>
  <!-- 多tab支持 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1/dist/docsify-tabs.min.js"></script>
  <!-- 代码复制 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <!-- 底部 上一页下一页 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/external-script.min.js"></script>
  <!-- google 统计 -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/ga.min.js"></script> -->
  <!-- 全文搜索 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.js"></script>
  <!-- 图片放大缩小 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <!-- 字数统计 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-count@latest/dist/countable.min.js"></script>
  <!-- 侧边栏目录折叠 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <!-- 页面右侧 TOC -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-plugin-toc@1.1.0/dist/docsify-plugin-toc.min.js"></script>
  <!-- emoji -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>

  <script>
    /*
     * 封面“开始阅读”兜底：不依赖 docsify 内部滚动逻辑，
     * 点击后直接收起封面并滚动到正文，URL 由浏览器原生变为
     * #/?id=php-extension-cookbook。
     */
    document.addEventListener('click', function (e) {
      var a = e.target && e.target.closest ? e.target.closest('a') : e.target;
      if (a && a.getAttribute && a.getAttribute('href') === '#/?id=php-extension-cookbook') {
        setTimeout(function () {
          var cover = document.querySelector('.cover');
          if (cover) cover.style.display = 'none';
          var h1 = document.getElementById('php-extension-cookbook');
          if (h1) { h1.scrollIntoView({ block: 'start' }); }
          else    { window.scrollTo(0, 0); }
        }, 50);
      }
    }, true);
  </script>
</body>
</html>
